services:
  open-seo:
    image: ghcr.io/every-app/open-seo:latest
    restart: unless-stopped
    networks:
      - dokploy-network
      - default
    depends_on:
      - umay-adapter
    environment:
      - CLOUDFLARE_INCLUDE_PROCESS_ENV=true
      - PORT=${PORT:-3001}
      - AUTH_MODE=local_noauth
      - OPENSEO_TELEMETRY_DISABLED=true
      - DO_NOT_TRACK=true
      - ALLOWED_HOST=${ALLOWED_HOST:-starseo.canpolatkaya.com}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://starseo.canpolatkaya.com}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-http://umay-adapter:4000/v1}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-umay-akilli}
      - VITE_SHOW_DEVTOOLS=false
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - DATAFORSEO_API_KEY=${DATAFORSEO_API_KEY}
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - open_seo_data:/app/.wrangler

  umay-adapter:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./adapter:/app
    command: ["node", "index.mjs"]
    networks:
      - default

networks:
  dokploy-network:
    external: true
volumes:
  open_seo_data:
