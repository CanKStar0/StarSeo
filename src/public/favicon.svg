<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <radialGradient id="glassGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.05"/>
    </radialGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Magnifying Glass Handle -->
  <line x1="37" y1="37" x2="52" y2="52" stroke="url(#handleGrad)" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Handle Grip Accent -->
  <line x1="43" y1="43" x2="50" y2="50" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Lens Outer Rim Shadow -->
  <circle cx="27" cy="27" r="14.5" fill="none" stroke="#020617" stroke-width="5.5" opacity="0.4"/>

  <!-- Lens Fill (Glass reflection) -->
  <circle cx="27" cy="27" r="14" fill="url(#glassGlow)"/>

  <!-- Lens Outer Rim -->
  <circle cx="27" cy="27" r="14" fill="none" stroke="url(#lensGrad)" stroke-width="4"/>

  <!-- Top-left Lens Highlight / Glare -->
  <path d="M 18 24 A 10 10 0 0 1 24 18" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

  <!-- 4-point Radiant Star Inside Lens -->
  <path d="M 27 19.5 Q 27 27 34.5 27 Q 27 27 27 34.5 Q 27 27 19.5 27 Q 27 27 27 19.5 Z" 
        fill="url(#starGrad)" 
        filter="url(#glow)"/>

  <!-- Center Star Core Glow -->
  <circle cx="27" cy="27" r="2" fill="#FFFFFF" opacity="0.9"/>
</svg>