services:
  open-seo:
    image: ghcr.io/every-app/open-seo:latest
    restart: unless-stopped
    networks:
      - dokploy-network
      - default
    depends_on:
      - umay-adapter
    environment:
      - CLOUDFLARE_INCLUDE_PROCESS_ENV=true
      - PORT=3001
      - AUTH_MODE=local_noauth
      - OPENSEO_TELEMETRY_DISABLED=true
      - DO_NOT_TRACK=true
      - ALLOWED_HOST=starseo.canpolatkaya.com
      - BETTER_AUTH_URL=https://starseo.canpolatkaya.com
      - OPENROUTER_API_KEY=umay_sk_live_d2b8ca070bc219b94b73ac105b6aecea795e23fe15c7e372
      - OPENROUTER_BASE_URL=http://umay-adapter:4000/v1
      - OPENROUTER_MODEL=umay-akilli
      - VITE_SHOW_DEVTOOLS=false
      - BETTER_AUTH_SECRET=921hd8912h89sd1h298sdh129921hd8912h89sd1h298sdh129
      - DATAFORSEO_API_KEY=d3h4Z2dvaHRhN2hoam5wMmdzZjpiYTk4Y2VkNjU2MGE4YTQ4
    ports:
      - "3001:3001"
    volumes:
      - open_seo_data:/app/.wrangler

  umay-adapter:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./adapter:/app
    command: ["node", "index.mjs"]
    networks:
      - default

networks:
  dokploy-network:
    external: true
volumes:
  open_seo_data:
